<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Owner dashboard | SalonWait</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header class="top">
<a class="brand" href="/">SalonWait <small>Owner dashboard</small>
</a>
<button id="logout" class="link-button">Log out</button>
</header>
<main>
<section>
<p class="eyebrow">TODAY AT A GLANCE</p>
<h1>Salon overview</h1>
<div id="summary" class="stats">
</div>
</section>
<section class="panel">
<h2>Walk-in queue</h2>
<form id="walkin-form" class="form-grid">
<label>Service<select id="walkin-service">
</select>
</label>
<label>Barber<select id="walkin-barber">
</select>
</label>
<button class="button">Add walk-in</button>
</form>
<div id="queue">
</div>
</section>
<section class="panel">
<h2>Today's bookings</h2>
<div id="bookings">
</div>
</section>
<section class="panel">
<h2>Add a service</h2>
<form id="service-form" class="form-grid">
<label>Name<input id="service-name" required>
</label>
<label>Price (â‚¹)<input id="service-price" type="number" min="0" step="0.01" required>
</label>
<label>Duration (minutes)<input id="service-duration" type="number" min="1" required>
</label>
<button class="button">Add service</button>
</form>
<div id="admin-message" role="status">
</div>
</section>
</main>
<script src="{{ url_for('static', filename='js/admin.js') }}" defer>
</script>
</body>
</html>
